spring.application.name=bag-shop

# Use H2 by default so the site runs without MySQL. Switch to mysql profile for MySQL.
spring.datasource.url=jdbc:h2:mem:bagshop;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.h2.console.enabled=true

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

app.jwt.secret=BagShopSecretKeyForLearningProjectMustBeAtLeast256BitsLong123456
app.jwt.expiration-ms=86400000

app.cors.allowed-origins=http://127.0.0.1:5500,http://localhost:5500,http://127.0.0.1:8080,http://localhost:8080

spring.web.resources.static-locations=classpath:/static/,file:../frontend/

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout — Bag Shop</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header>
    <div class="header-inner">
      <a class="logo" href="index.html">Bag Shop</a>
      <nav id="mainNav"></nav>
    </div>
  </header>
  <main>
    <div class="auth-card wide">
      <h1>Checkout</h1>
      <form id="checkoutForm">
        <label>Shipping address</label>
        <textarea id="address" rows="3" required placeholder="Street, city, ZIP"></textarea>
        <button class="btn" type="submit">Place order</button>
      </form>
      <p id="error" class="error"></p>
      <p id="success" class="success"></p>
    </div>
  </main>
  <script src="js/script.js"></script>
  <script>
    renderNav('cart');
    if (!requireAuth()) throw new Error('auth');
    (async () => {
      const profile = await loadProfile();
      if (profile.address) document.getElementById('address').value = profile.address;
    })();
    document.getElementById('checkoutForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      document.getElementById('error').textContent = '';
      try {
        const order = await checkout(document.getElementById('address').value);
        document.getElementById('success').textContent =
          `Order #${order.id} placed! Total ${formatMoney(order.totalAmount)}`;
        setTimeout(() => { window.location.href = 'orders.html'; }, 1500);
      } catch (ex) {
        document.getElementById('error').textContent = ex.message;
      }
    });
  </script>
</body>
</html>
